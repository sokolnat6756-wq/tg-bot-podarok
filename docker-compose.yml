# Запуск на VPS (Timeweb / Амстердам и др.).
# Секреты только из .env на сервере — не коммитьте .env в Git.

services:
  bot:
    build: .
    container_name: tg-bot-podarok
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    volumes:
      # Счётчик открыток переживает пересборку контейнера
      - ./data:/app/data
    # Health внутри сервера; наружу открывать 8080 не обязательно
    ports:
      - "127.0.0.1:8080:8080"
